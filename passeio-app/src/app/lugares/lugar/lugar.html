<div class="p-6 max-w-lg mx-auto bg-white shadow-lg rounded-lg mt-6">
  <h2 class="text-2x1 font-semibold text-gray-700 mg-4">Novo Lugar</h2>
  <hr>
  <br>

  <form id="categoriaForm" [formGroup]="camposForm" (ngSubmit)="salvar()">

    <div class="mb-4">
      <label for="nome" class="block text-gray-600 font-medium mb-2">Nome do Lugar</label>
      <input type="text" id="nome" name="nome" formControlName="nome" placeholder="Ex: Praia do Sol, Restaurante Estrela" class="w-full p-3 border border-gray-300 rounded shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-400">
    </div>

    <div class="mb-4">
      <label for="categoria" class="block text-gray-600 font-medium mb-2">Categoria</label>
      <select name="categoria" formControlName="categoria" id="categoria" class="w-full p-3 border border-gray-300 rounded shadow-sm focus:outline-none focus:ring focus:ring-blue-400">
        <option [value]="" selected>Selecione uma categoria</option>

        @for(cat of categorias; track cat.id){
        <option [value]="cat.nome">{{cat.nome}}</option>
        }

      </select>
    </div>

    <div class="mb-4">
      <label for="localizacao" class="block text-gray-600 font-medium mb-2">Localização</label>
      <input type="text" id="localizacao" name="localizacao" formControlName="localizacao" placeholder="Ex: São Paulo" class="w-full p-3 border border-gray-300 rounded shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-400">
    </div>

    <label for="urlFoto" class="block text-gray-600 font-medium mb-2">Url Foto</label>
    <div class="mb-4">

      <input type="text" id="urlFoto" name="urlFoto" formControlName="urlFoto" placeholder="Ex: http://exemplo.com/foto.png" class="w-full p-3 border border-gray-300 rounded shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-400">
    </div>
    <div class="mb-4">
      <label for="avaliacao" class="block text-gray-600 font-medium mb-2">Avaliação</label>

      <select name="avaliacao" formControlName="avaliacao" id="avaliacao" class="w-full p-3 border border-gray-300 rounded shadow-sm focus:outline-none focus:ring focus:ring-blue-400">
        <option [value]="" selected>Selecione uma Avaliação</option>
        <option [value]="1">1 - Ruim</option>
        <option [value]="2">2 - Regular</option>
        <option [value]="3">3 - Bom</option>
        <option [value]="4">4 - Muito Bom</option>
        <option [value]="5">5 - Excelente</option>


      </select>
    </div>

    <button type="submit" class="w-full bg-blue-600 text-white font-semibold p-3 rounded shadow hover:bg-blue-700 cursor-pointer">
      Cadastrar Lugar
    </button>

  </form>


</div>
